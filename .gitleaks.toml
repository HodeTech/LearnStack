# LearnStack — gitleaks allowlist.
#
# Active hygiene: every committed file is scanned by `gitleaks protect
# --staged` in the pre-commit hook + `gitleaks/gitleaks-action@v2` in CI.
# Per Standards 20 § Secrets Management:
#     "No secret may appear in code, in `appsettings.*.json` checked into
#      git, or in container env vars. The pre-commit hook scans for
#      high-entropy strings; CI fails on hits."
#
# The allowlist below is **regex-scoped**, not path-scoped — a path-based
# allowlist (`paths = ['^infra/compose/dev\.yml$', …]`) would suppress
# EVERY detector on those files, so a real AWS key smuggled into
# `dev.yml` would slip through. Listing the literal dev credentials by
# regex keeps the file-level scanning hot; only the exact known dev
# literals are skipped.

[extend]
# Inherit the upstream default rule set (AWS keys, GCP service accounts,
# Stripe keys, OpenAI tokens, generic high-entropy strings, …).
useDefault = true

# ─── Dev-credential literals (intentional, never production) ────────────
# Each entry MUST cite WHY the literal is in-repo and which production
# path replaces it. Anything added here lives in a `Development`-
# deployment-only file and is *never* a production secret.

[[allowlists]]
description = "Vault dev root token — boots Vault `-dev` mode; production uses AppRole / Kubernetes auth per ADR-0014."
regexTarget = "match"
regexes = [
    '''learnstack-dev-root-token''',
]

[[allowlists]]
description = "Keycloak admin password for the master realm in dev compose; production seeds via ISecretProvider per Standards 12."
regexTarget = "match"
regexes = [
    '''admin-dev-secret''',
]

[[allowlists]]
description = "Keycloak demo-user passwords for the seeded realm JSONs; the users themselves are scoped to the `learnstack`/`learnstack-hub` dev realms only."
regexTarget = "match"
regexes = [
    '''demo-dev-secret''',
]

[[allowlists]]
description = "Confidential client secret for the `learnstack-api` client in the dev realm seed; production realm provisioning (Terraform / keycloak-config-cli) issues a per-deployment value."
regexTarget = "match"
regexes = [
    '''learnstack-api-dev-secret''',
]

[[allowlists]]
description = "LiveKit dev API key + secret — Phase 08c wires per-session credential minting through ILiveClassProvider; the >=32-byte secret would otherwise trip the generic high-entropy rule."
regexTarget = "match"
regexes = [
    '''devkey''',
    '''devsecret-32-byte-min-length-padding-xyz''',
]

[[allowlists]]
description = "Coturn static long-term credential pair for dev `turnutils_uclient` exploration; Phase 08c flips to `use-auth-secret` for ephemeral tokens."
regexTarget = "match"
regexes = [
    '''^devuser$''',
    '''^devsecret$''',
]

[[allowlists]]
description = "SeaweedFS S3 dev credential pair from `infra/seaweedfs/s3-identities.json`; Phase 02b storage adapter swaps in Vault-issued credentials."
regexTarget = "match"
regexes = [
    '''learnstack-dev-secret''',
]

[[allowlists]]
description = "Meilisearch dev master key (documented in compose README); production loads via ISecretProvider per Standards 12."
regexTarget = "match"
regexes = [
    '''learnstack-dev-master-key''',
]

[[allowlists]]
description = "Kafka KRaft cluster id literal — not a secret, but the URL-safe Base64 shape (22 chars) trips the generic high-entropy rule."
regexTarget = "match"
regexes = [
    '''ofPH0p5rSlK52BxOX3qLPQ''',
]

# ─── Template / example files exempt from path-only secret patterns ────
# These files exist precisely to document credential SHAPES; gitleaks's
# generic high-entropy heuristic flags the placeholder values even though
# every one is overridden via `.env`. Narrow path allowlist (NOT full-file
# rule suppression — the regex allowlists above still scope what counts as
# a dev literal even when scanned via these paths).
[[allowlists]]
description = "Env templates carry placeholder shapes by design; real values live in gitignored `.env` / `.env.local`."
paths = [
    '''^\.env\.example$''',
    '''^frontend/apps/web/\.env\.local\.example$''',
]
