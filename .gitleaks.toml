# LearnStack — gitleaks allowlist.
#
# Active hygiene: every committed file is scanned by `gitleaks protect
# --staged` in the pre-commit hook + `gitleaks/gitleaks-action@v2` in CI.
# Per Standards 20 § Secrets Management:
#     "No secret may appear in code, in `appsettings.*.json` checked into
#      git, or in container env vars. The pre-commit hook scans for
#      high-entropy strings; CI fails on hits."
#
# The allowlist below lists intentional dev-only credentials so the scan
# stays high-signal. Every entry MUST cite WHY the credential is in-repo
# and which production path replaces it. Anything added here lives in a
# `Development`-deployment-only file and is *never* a production secret.

[extend]
# Inherit the upstream default rule set (AWS keys, GCP service accounts,
# Stripe keys, OpenAI tokens, generic high-entropy strings, …).
useDefault = true

# ─── Dev infrastructure literals — intentional, never production ────────
[[allowlist]]
description = "Dev-only credentials committed for local-stack bootstrap; production loads everything via ISecretProvider per Standards 20."
paths = [
    # Single source of truth for dev env (no real secrets — placeholders only).
    '''^\.env\.example$''',
    '''^frontend/apps/web/\.env\.local\.example$''',
    # Compose stack — every literal has a `# Dev-only` comment + a Vault path.
    '''^infra/compose/dev\.yml$''',
    '''^infra/compose/postgres-init/.*\.sql$''',
    # Keycloak realm seeds — demo users + dev client secrets per ADR-0004 Amendment 1.
    '''^infra/keycloak/realms/.*\.json$''',
    '''^infra/keycloak/README\.md$''',
    # Dapr component YAMLs — vaultToken now uses `secretKeyRef` indirection,
    # but other dev-only metadata literals (e.g. kafka authType none) live here.
    '''^infra/dapr/components/.*\.ya?ml$''',
    '''^infra/dapr/README\.md$''',
    # LiveKit + Coturn dev key/secret pair (Phase 08c rotates via
    # ILiveClassProvider; the padded 32-byte secret would otherwise trip
    # the generic high-entropy rule).
    '''^infra/livekit/livekit\.yaml$''',
    '''^infra/coturn/turnserver\.conf$''',
    # SeaweedFS S3 identity file — Phase 02b storage adapter wires Vault.
    '''^infra/seaweedfs/s3-identities\.json$''',
    '''^infra/seaweedfs/README\.md$''',
    # APISIX route table — currently no credentials, but room for future
    # dev-only JWT public-key embeds.
    '''^infra/apisix/.*\.ya?ml$''',
    # Compose orchestration README documents the dev credentials inline
    # so the scanner shouldn't flag the same string twice.
    '''^infra/compose/README\.md$''',
    # Documentation that NAMES the dev credentials for orientation
    # (`docs/standards/12-infrastructure.md`, the dapr README, the
    # keycloak README, the realm-isolation note). Allow only the specific
    # standards files that walk credential rotation policy.
    '''^docs/standards/12-infrastructure\.md$''',
    '''^docs/standards/20-infrastructure-stack\.md$''',
]
