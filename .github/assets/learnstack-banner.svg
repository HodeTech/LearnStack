<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">One foundation. Many ways to teach.</title>
  <desc id="desc">Three ascending layers in mint, blue and violet beside the LearnStack motto on a dark navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c172c"/>
      <stop offset="1" stop-color="#142443"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8cf2d1"/>
      <stop offset="1" stop-color="#4fc4b0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83bcff"/>
      <stop offset="1" stop-color="#547cde"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b4a5fb"/>
      <stop offset="1" stop-color="#7977cc"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1120" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="320" fill="url(#background)"/>
    <g fill="none" stroke="#86b8e9" stroke-opacity=".12">
      <circle cx="932" cy="164" r="240"/>
      <circle cx="932" cy="164" r="188"/>
      <circle cx="932" cy="164" r="136"/>
    </g>
    <path d="M64 65h48" stroke="#86e9cd" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="137" fill="#f2f6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.7">One foundation.</text>
    <text x="64" y="202" fill="#91ebd1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.7">Many ways to teach.</text>
    <text x="67" y="263" fill="#b7c8e3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" letter-spacing="3">LEARNSTACK / EDUCATION PLATFORM</text>
    <g stroke-linejoin="round">
      <path d="m799 221 113-53 113 53-113 54z" fill="#59629f"/>
      <path d="m799 207 113-53 113 53-113 54z" fill="url(#violet)" stroke="#c6bbfc" stroke-opacity=".6"/>
      <path d="m799 173 113-53 113 53-113 54z" fill="#3f659f"/>
      <path d="m799 159 113-53 113 53-113 54z" fill="url(#blue)" stroke="#b1d3ff" stroke-opacity=".7"/>
      <path d="m799 125 113-53 113 53-113 54z" fill="#359b92"/>
      <path d="m799 111 113-53 113 53-113 54z" fill="url(#mint)" stroke="#c8ffec" stroke-opacity=".8"/>
      <path d="m867 111 45-21 45 21-45 21z" fill="#153947" fill-opacity=".32"/>
    </g>
  </g>
</svg>
