# Dapr secret store — HashiCorp Vault backend.
# Backs `ISecretProvider`. Dev compose runs Vault in -dev mode; production
# replaces this with an authenticated Vault cluster + AppRole / Kubernetes
# auth method.
#
# Single source of truth: `VAULT_ROOT_TOKEN` from the repo-root `.env.example`.
# Dapr 1.10+ substitutes `{{env.VAR_NAME}}` in component metadata values at
# load time, so the same env var the `vault` compose service boots with also
# authenticates Dapr — changing `.env` updates every consumer in lockstep.
# (Per `infra/dapr/README.md` § Vault token, this is the Phase 07 DX commitment
# that retires the prior two-file literal duplication.)
#
# Dev-only token. NEVER deploy a config carrying `vaultToken` literally in
# production — wire the auth method via Vault's Dapr component metadata
# patterns documented at https://docs.dapr.io/.
#
# KV ENGINE NOTE (Phase 02b): Vault -dev mounts `secret/` as KV v2; this
# component reads from that mount with `vaultKVPrefix: secret`. Some Dapr
# Vault-component versions need an explicit `engineType: kv-v2` metadata
# entry to detect v2's `/data/` indirection. Validate `GET
# /v1.0/secrets/secretstore/<path>` against a known dev secret before the
# first ISecretProvider integration test in Phase 02b; if it returns 404
# while the secret exists, add `engineType: kv-v2` here.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: http://vault:8200
    - name: vaultToken
      value: '{{env.VAULT_ROOT_TOKEN}}'
    - name: vaultKVPrefix
      value: secret
