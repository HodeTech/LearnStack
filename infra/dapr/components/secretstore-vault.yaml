# Dapr secret store — HashiCorp Vault backend.
# Backs `ISecretProvider`. Dev compose runs Vault in -dev mode; production
# replaces this with an authenticated Vault cluster + AppRole / Kubernetes
# auth method.
#
# Single source of truth: `VAULT_ROOT_TOKEN` from the repo-root `.env.example`.
# Indirection chain (Dapr 1.x — verified syntax):
#   1. `.env` carries the token (gitignored).
#   2. `infra/compose/dev.yml` boots Vault with that token AND passes it
#      into `dapr-sidecar-api` as a process env var (`VAULT_ROOT_TOKEN`).
#   3. `secretstore-envvar.yaml` registers a `secretstores.local.env`
#      component named `envvar-secrets`.
#   4. THIS component's `auth.secretStore: envvar-secrets` makes Dapr
#      resolve the `vaultToken` metadata via `secretKeyRef` — pulling the
#      token from the process env at load time, never from the literal.
# Changing `.env` therefore updates every consumer at the next `docker
# compose up`. There is no two-file edit risk.
#
# KV ENGINE NOTE (Phase 11): Vault -dev mounts `secret/` as KV v2; this
# component reads with `vaultKVPrefix: learnstack`, giving the documented
# `secret/learnstack/<area>` layout. Some Dapr Vault-component versions need
# an explicit mount override to detect v2's `/data/` indirection. If a read
# 404s while the secret exists, the knob is `enginePath` — there is no
# `engineType` metadata key on `secretstores.hashicorp.vault`, and Dapr
# ignores unknown metadata silently, so guessing one is a no-op with no
# feedback. Validate `GET /v1.0/secrets/<store>/<path>` before the first
# Vault-backed ISecretProvider test. The Dapr/Vault adapter itself is
# demand-gated to Phase 11 per ADR-0035 — trigger: a production secret must
# rotate without a redeploy, or more than one operator needs access to
# production secrets. This component is committed so the seam is testable,
# not because anything reads it today.
#
# PRODUCTION NOTE: Never deploy a config carrying `vaultToken` literally
# in production — wire the auth method via AppRole / Kubernetes per Dapr's
# documented patterns at https://docs.dapr.io/.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - name: vaultAddr
      value: http://vault:8200
    - name: vaultToken
      secretKeyRef:
        name: VAULT_ROOT_TOKEN
        key: VAULT_ROOT_TOKEN
    - name: vaultKVPrefix
      # `learnstack`, not `secret`. Vault -dev mounts the KV engine AT
      # `secret/`, and Dapr prepends vaultKVPrefix INSIDE that mount — so
      # `secret` here resolves reads to `secret/data/secret/<key>` and the
      # documented `secret/learnstack/<area>` layout is unreachable.
      value: learnstack
auth:
  secretStore: envvar-secrets
