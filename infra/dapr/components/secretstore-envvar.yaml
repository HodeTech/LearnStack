# Dapr local environment-variable secret store.
#
# Lightweight indirection layer so other components can reference process
# env vars via `secretKeyRef` instead of carrying literal values in their
# metadata. The `{{env.VAR}}` template syntax some Dapr docs reference is
# NOT a stock Dapr feature — components substitute env vars only through
# this `secretstores.local.env` pattern (Dapr 1.0+) or through the
# `auth.secretStore` indirection.
#
# Dev-only. Production swaps `secretstores.hashicorp.vault` (with AppRole)
# in front of every component, so this env-secret-store does not ship
# outside `DeploymentMode == Development`.

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envvar-secrets
spec:
  type: secretstores.local.env
  version: v1
