# LearnStack — local dev infrastructure.
#
# Scope of THIS file (Phase 01 packets 1-4): the data-plane services + the
# self-hosted Keycloak identity provider (two realms). LiveKit OSS, Coturn,
# Kafka, Vault, the Dapr sidecar, and APISIX land in subsequent Phase-01
# packets per the roadmap (docs/roadmap/phase-01-repository-tooling.md
# § Local Infrastructure).
#
# Operational rules: Standards 12 § Local Infrastructure + Standards 20.
# Tenant isolation in MinIO is enforced by key prefix (`{tenant_id}/...`) —
# never bucket-per-tenant (Standards 12 § Object Storage Operations).

name: learnstack-dev

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: learnstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnstack
      POSTGRES_PASSWORD: learnstack
      POSTGRES_DB: learnstack
      # Dev-only. Production secrets come from Vault via ISecretProvider.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First-boot init scripts (idempotent SQL). Creates the `keycloak`
      # database the Keycloak service uses; see ./postgres-init/README.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnstack -d learnstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: learnstack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: learnstack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Dev-only. Production credentials come from Vault via ISecretProvider.
      MINIO_ROOT_USER: learnstack
      MINIO_ROOT_PASSWORD: learnstack-dev-secret
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: learnstack-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      # Dev-only knobs (no credentials); MP_SMTP_AUTH_ALLOW_INSECURE in
      # particular must never be set in production.
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      # Use the binary's built-in readyz subcommand — it hits the in-process
      # /readyz endpoint and exits non-zero until the HTTP listener is bound.
      # Works whether the image is Alpine (v1.21.x) or any future variant.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: learnstack-meilisearch
    restart: unless-stopped
    environment:
      # Dev-only. Production credentials come from Vault via ISecretProvider.
      MEILI_ENV: development
      MEILI_MASTER_KEY: learnstack-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Identity stack (Phase 01 packet 4) ----------------------------------
  # Self-hosted Keycloak, two realms (`learnstack` tenant-facing + `learnstack-hub`
  # operator). Per ADR-0004 + ADR-0019 the realms are hard-isolated; tokens from
  # one realm are never accepted on the other realm's endpoints. See
  # ../keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: learnstack-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # Dev-only. Production credentials come from Vault via ISecretProvider.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-dev-secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: learnstack
      KC_DB_PASSWORD: learnstack
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: token-exchange,admin-fine-grained-authz
    ports:
      - "8080:8080"
    volumes:
      # Realm seed JSONs (learnstack + learnstack-hub) — Keycloak imports them
      # at first start when the realms do not yet exist in the DB.
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 exposes /health/ready on the dedicated management
      # interface (port 9000) when KC_HEALTH_ENABLED=true. The image is
      # UBI-9-minimal based and ships curl; this is the upstream-recommended
      # readiness pattern.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meilisearch-data:
